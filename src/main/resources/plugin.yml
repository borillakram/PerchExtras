name: PerchExtras
main: com.olziedev.spotextras.SpotExtras
version: ${version}
author: Olzie
api-version: '26.2'
permissions:
  antibackteleport.command:
    description: Antiback teleport command
    default: op
  potion.command.milk:
    description: Use the milk command
    default: op
  realestate.admin:
    description: Open the admin manage menu
    default: op
  realestate.create.noextend:
    description: Create non-extendable grouped rents with the -ne flag
    default: op
  realestate.bypass.noextend:
    description: Bypass non-extendable rent group restrictions
    default: op
  realestate.create.exclusive:
    description: Create exclusive grouped rents with the -e flag
    default: op
  realestate.bypass.exclusive:
    description: Bypass active exclusive rent group restrictions
    default: op
  realestate.create.offline:
    description: Create offline-limited rents with the -offline flag
    default: op
  realestate.bypass.offline:
    description: Prevent offline-limited rents from ending due to inactivity
    default: op
  evergreen.bulkmapart.use:
    description: Allows use of /bulkmapart <amount>.
    default: op
  evergreen.bulkmapart.reload:
    description: Allows use of /bulkmapart reload.
    default: op
  evergreen.armorstandcmd:
    description: Add, clear, inspect and run commands on armor stands.
    default: op
depend:
  - WorldGuard
  - Essentials
  - Vault
  - GriefPrevention
commands:
  bulkmapart:
    description: Duplicate the map-art container held in your main hand.
    usage: /bulkmapart <amount|reload>
  runcommandall:
    description: Runs a command for all online players.
    usage: /<command> <command with \$player>
    permission: perchextras.runcommandall
    permission-message: §cYou do not have permission to use this command.
  armorstandcommand:
    description: Manage commands stored on armor stands.
    usage: /armorstandcommand <addcmd|clear|info|edit|reload|config>
    aliases: [armorstandcmd, ascmd]
    permission: evergreen.armorstandcmd
    permission-message: §cYou do not have permission to use this command.
